name: CI

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest]
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Lint
        run: npm run jshint
      - name: Test
        run: npm run test

  prebuild:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Each prebuild is built natively on a runner of its target architecture.
        # ia32 uses 32-bit Node.js on an x64 Windows runner.
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-latest
            platform: win32
            arch: ia32
            node-arch: x86
          - os: windows-11-arm
            platform: win32
            arch: arm64
          - os: macos-26-intel
            platform: darwin
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          # Node.js 22 is the oldest supported version and the newest one with 32-bit Windows builds.
          node-version: 22.x
          architecture: ${{ matrix.node-arch }}
      - name: Install
        run: npm install
      - name: Prebuild binaries
        run: npm run prebuild --v8_enable_pointer_compression=false --v8_enable_31bit_smis_on_64bit_arch=false $([[ $OSTYPE != darwin* ]] && echo --llvm_version=0.0 || true) -- --target "$(node -p process.versions.node)"
        shell: bash
      - name: Check prebuilt binary
        run: |
          ls prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/*.node
          rm -rf build
          npm run test
        shell: bash
      - name: Upload binaries as an artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds

  publish:
    needs: prebuild
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm install
      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true
      - name: List prebuilds
        run: ls -R prebuilds
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}